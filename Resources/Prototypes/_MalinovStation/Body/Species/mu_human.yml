# No default markings until the species has its own sprites.
- type: markingsGroup
  id: MuHumanHorns
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
      weight: 0

- type: markingsGroup
  id: MuHumanTail
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false
      weight: 0
    enum.HumanoidVisualLayers.TailOverlay:
      limit: 0
      required: false

- type: entity
  parent: AppearanceHuman
  id: AppearanceMuHuman
  categories: [ HideSpawnMenu ]
  name: mu-human appearance
  components:
  - type: HumanoidProfile
    species: MuHuman
  - type: InitialBody
    # These dictionaries replace the human defaults, so preserve every organ and relationship.
    organs:
      Torso: OrganHumanTorsoWithTail
      Head: OrganHumanHeadWithHorns
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
      Horns: OrganMuHumanHorns
      Tail: OrganMuHumanTail
    relationships:
      Torso: [Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail]
      Head: [Brain, Eyes, Tongue, Ears, Horns]
      ArmLeft: [HandLeft]
      ArmRight: [HandRight]
      LegLeft: [FootLeft]
      LegRight: [FootRight]

- type: entity
  parent: [ AppearanceMuHuman, MobHuman ]
  id: MobMuHuman
  name: Urist McMu
  suffix: WIP
  components:
  - type: SolutionManager
    solutions: [ SolutionMilk ]
  - type: MilkProducer
    solutionName: milk

- type: entity
  parent: OrganBaseHumanoidAppendage
  id: OrganMuHumanHorns
  categories: [ HideSpawnMenu ]
  name: mu-human horns
  components:
  - type: Organ
    category: Horns
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.HeadTop
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.HeadTop
    markingData:
      group: MuHumanHorns
      layers: [ HeadTop ]

- type: entity
  parent: OrganBaseHumanoidAppendage
  id: OrganMuHumanTail
  categories: [ HideSpawnMenu ]
  name: mu-human tail
  components:
  - type: Organ
    category: Tail
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Tail
  - type: VisualOrganMarkings
    markingData:
      group: MuHumanTail
      layers: [ Tail, TailOverlay ]
