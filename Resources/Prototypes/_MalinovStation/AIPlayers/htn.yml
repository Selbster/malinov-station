# Root behaviour for AI players.
# Priority order: immediate self-preservation (Flee) first, then survival (Food/Thirst, reusing the vanilla
# FoodCompound gated on the mob's own SatiationComponent), then an explicit ForcedMoveCompound (Milestone
# 5's MoveTo action), then altruism (HelpInjured), then professional work (RepairMachine, Milestone 11 - a
# professional AI attempts a real repair before flopping down to rest, while the selected goal and recovery threshold allow rest), then self-care (Rest, driven by NeedsComponent.Fatigue), falling back
# to wandering (AIPlayerIdleCompound, memory-biased - see its own comment below) when nothing is urgent.
#
# Milestone 1: this top-to-bottom order is a coarse safety net, not the real arbitrator. Flee/HelpInjured/
# RepairMachine/Rest each additionally require CurrentGoalPrecondition (owner.GoalComponent.CurrentGoal), so
# whenever more than one of them is simultaneously eligible, GoalSystem's priority arithmetic (needs + danger +
# personality, or an LLM override) picks which one actually runs - not just YAML declaration order. Food/Thirst
# (pure vanilla reuse) and ForcedMove (an explicit directive, not a needs/danger goal) are deliberately left
# out of that gate; see GoalComponent's doc comment.
- type: htnCompound
  id: AIPlayerRootCompound
  branches:
    - tasks:
        - !type:HTNCompoundTask
          task: FleeCompound
    - tasks:
        - !type:HTNCompoundTask
          task: AiFoodCompound
    - tasks:
        - !type:HTNCompoundTask
          task: ForcedMoveCompound
    - tasks:
        - !type:HTNCompoundTask
          task: HelpInjuredCompound
    - tasks:
        - !type:HTNCompoundTask
          task: RepairMachineCompound
    - tasks:
        - !type:HTNCompoundTask
          task: RestCompound
    - tasks:
        - !type:HTNCompoundTask
          task: AIPlayerIdleCompound

# AI-player-specific replacement for vanilla IdleCompound (Resources/Prototypes/NPCs/idle.yml, shared by
# every NPC in the game - never edited directly). Identical two-branch shape (resume waiting / pick a spot
# and wait there), except the "pick a spot" step tries a remembered place first
# (PickRememberedOrAccessibleOperator) so idle wandering looks purposeful rather than uniformly random, per
# live playtest feedback - falling back to the same accessible-random-point behaviour vanilla uses whenever
# there's nothing remembered yet (e.g. a freshly-spawned or legacy AI player).
#
# pathfindInPlanning: true (AI Players 0.5 - unlike the other MoveToOperator steps in this file, but the same
# reasoning as FleeCompound above) matters here for the same class of reason: PickRememberedOrAccessibleOperator
# deliberately never excludes a remembered pick just because it might be unreachable (see that operator's own
# doc comment) - SeedKnownBeacons remembers every station beacon regardless of access at spawn, so a low-access
# job on a real map can end up with several permanently-unreachable candidates in the weighted pool. A live run
# during that milestone showed this degrade from "occasional failure" into MoveToOperator failing on nearly
# every single Idle replan (a real thrash, not the rare re-roll the operator's doc comment describes) once
# pathfindInPlanning: false let each bad pick get committed to and walked toward before failing reactively.
# With this flag, an unreachable pick fails fast at planning time instead - this branch simply produces no
# plan that cycle and HTN's own replan cadence tries again a moment later (same "always finishes eventually"
# philosophy), at the cost of losing AiTraceSystem's PlanAborted signal for this specific branch (see
# ForcedMoveCompound's comment below for the general trade-off this flag makes).
- type: htnCompound
  id: AIPlayerIdleCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime

    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: false
        - !type:PulledPrecondition
          isPulled: false
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:PickRememberedOrAccessibleOperator
            rangeKey: IdleRange

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true

        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime

        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime

# Milestone 7: reacts to being attacked (DangerComponent.ThreatSource, set by DangerSystem on
# DamageChangedEvent). Picks a point away from the threat and walks there; HTN's constant replanning keeps
# re-picking a fresh point away from the threat's current position for as long as it stays active.
# pathfindInPlanning: true (Milestone 1, unlike the other MoveToOperator steps in this file) matters here:
# PickFleeDestinationOperator computes a raw "N units in a straight line away from the threat" point with no
# walkability awareness (it can land in a wall or off the accessible grid, e.g. a threat standing right next to
# the AI degenerates the direction to a fixed vector), which the other MoveToOperator steps don't risk since
# their targets are always another existing entity's own position. Without this flag, MoveToOperator.Plan()
# doesn't validate the target either, so an unreachable flee point would make the AI silently thrash
# (fail -> replan -> pick the same unreachable point -> fail again) rather than fleeing or falling back to
# something else it can actually do.
- type: htnCompound
  id: FleeCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:DangerPrecondition
            - !type:CurrentGoalPrecondition
              goal: Flee
          operator: !type:PickFleeDestinationOperator
            fleeDistance: 8

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true

# Milestone 7: reacts to seeing another character incapacitated nearby (DangerComponent.NearbyInjured, set
# by DangerSystem's perception scan). Walks over and says a concerned line (Milestone 5's Talk action).
- type: htnCompound
  id: HelpInjuredCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:HelpInjuredPrecondition
            - !type:CurrentGoalPrecondition
              goal: HelpInjured
          operator: !type:PickInjuredTargetOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          operator: !type:ComfortInjuredOperator

# Forced journeys use vanilla steering, with an execution identity and explicit completion reporting.
# AiJourneyOperator reports arrival, NoPath or preemption. AiBusyStateSystem tears down planning and
# movement outside HTN callbacks before removing the destination.
- type: htnCompound
  id: ForcedMoveCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: ForcedDestination
          operator: !type:AiJourneyOperator

# Moves somewhere out of the way and rests until Fatigue drops back down.
- type: htnCompound
  id: RestCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:FatiguePrecondition
              above: 0.3
            - !type:CurrentGoalPrecondition
              goal: Rest
          operator: !type:PickAccessibleOperator
            rangeKey: IdleRange

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false

        - !type:HTNPrimitiveTask
          operator: !type:RestOperator
            recoveryPerSecond: 0.05
            stopBelow: 0.3

# Milestone 11's first professional/job-specific goal: walk to a nearby damaged machine spotted by
# RepairOpportunitySystem and fix it with a welding tool. Both preconditions must hold: an eligible machine
# is in sight AND the AI's job may pursue this goal (RepairOpportunityPrecondition), and a Welding-quality
# tool is reachable somewhere - a hand, an equipped slot, or inside a storage item (backpack/belt/pocket)
# equipped in one of those slots (HasToolQualityPrecondition). ActivateHeldToolOperator does the matching
# fetch (if it wasn't already in a hand) + switches to whichever hand ends up holding it + lights it if
# needed (a freshly-held welder starts unlit, same as for a real player). The last step reuses vanilla
# InteractWithOperator, which drives the same InteractUsingEvent -> RepairableSystem pipeline a real player's
# click would. expectDoAfter: true (Milestone 1) matters here: RepairableSystem only ever starts a DoAfter when
# the interaction actually has something to do (target still damaged, tool quality/fuel/range all check out),
# so without this flag a no-op interaction (e.g. an unexpected edge case InteractWithOperator itself can't see)
# would silently report Finished - "arrived and clicked" is not "task completed" (spec Milestone 1 section 7).
# With it, that case correctly fails the task instead, which GoalSystem's stuck-goal warning (see GoalSystem.cs)
# can surface if it keeps happening on every replan.
- type: htnCompound
  id: RepairMachineCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:RepairOpportunityPrecondition
            - !type:HasToolQualityPrecondition
              quality: Welding
            - !type:CurrentGoalPrecondition
              goal: RepairMachine
          operator: !type:PickRepairTargetOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          operator: !type:ActivateHeldToolOperator
            quality: Welding

        - !type:HTNPrimitiveTask
          operator: !type:InteractWithOperator
            targetKey: RepairTarget
            expectDoAfter: true

        # Turns the welder back off and puts it away (belt/backpack/pocket) instead of leaving it lit and
        # in-hand indefinitely - the inverse of ActivateHeldToolOperator above, see its own doc comment.
        - !type:HTNPrimitiveTask
          operator: !type:DeactivateAndStowToolOperator
            quality: Welding

# AI players wait for ingestion itself, rather than a generic alternative interaction.
- type: htnCompound
  id: AiFoodCompound
  branches:
    # Approach a consumable, then wait for ingestion before choosing another task.
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:SatiationPrecondition
              satiationType: Hunger
              below: Peckish
          operator: !type:UtilityOperator
            proto: NearbyFood

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:AiConsumeOperator
    # The drink branch uses the same execution contract.
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:SatiationPrecondition
              satiationType: Thirst
              below: Parched
          operator: !type:UtilityOperator
            proto: NearbyDrink

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: false
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: InteractRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:AiConsumeOperator
