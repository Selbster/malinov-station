# Organ extraction/installation surgeries. Availability of each is derived from whether the patient
# currently has (or lacks) targetOrgan - see SharedSurgerySystem.GetAvailableSurgeries.

# Heart (thoracic)

- type: surgery
  id: SurgeryHeartExtraction
  name: surgery-heart-extraction-name
  description: surgery-heart-extraction-desc
  targetOrgan: Heart
  requireOrganPresent: true
  steps:
  - SurgeryStepIncision
  - SurgeryStepSternotomy
  - SurgeryStepRetraction
  - SurgeryStepClampBleeders
  - SurgeryStepExtractOrgan
  - SurgeryStepCauterize

- type: surgery
  id: SurgeryHeartInstallation
  name: surgery-heart-installation-name
  description: surgery-heart-installation-desc
  targetOrgan: Heart
  requireOrganPresent: false
  steps:
  - SurgeryStepIncision
  - SurgeryStepSternotomy
  - SurgeryStepRetraction
  - SurgeryStepClampBleeders
  - SurgeryStepInsertOrgan
  - SurgeryStepCauterize

