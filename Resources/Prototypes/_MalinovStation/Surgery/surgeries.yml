# Organ extraction/installation surgeries. Availability of each is derived from whether the patient
# currently has (or lacks) targetOrgan - see SharedSurgerySystem.GetAvailableSurgeries.

# Brain (cranial)

- type: surgery
  id: SurgeryBrainExtraction
  name: surgery-brain-extraction-name
  description: surgery-brain-extraction-desc
  targetOrgan: Brain
  requireOrganPresent: true
  steps:
  - SurgeryStepIncision
  - SurgeryStepTrepanation
  - SurgeryStepRetraction
  - SurgeryStepClampBleeders
  - SurgeryStepExtractOrgan
  - SurgeryStepCauterize

- type: surgery
  id: SurgeryBrainInstallation
  name: surgery-brain-installation-name
  description: surgery-brain-installation-desc
  targetOrgan: Brain
  requireOrganPresent: false
  requiresOrgan: Head
  steps:
  - SurgeryStepIncision
  - SurgeryStepTrepanation
  - SurgeryStepRetraction
  - SurgeryStepClampBleeders
  - SurgeryStepInsertOrgan
  - SurgeryStepCauterize

